[package]
name = "dev-launcher"
version = "0.1.0"
description = "DevLauncher - 开发机项目管理器"
authors = ["DevLauncher"]
edition = "2021"
rust-version = "1.78"

# Tauri 要求的库入口
[lib]
name = "dev_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# sqlx 直接依赖：tauri-plugin-sql 的 DbPool::execute/select 是 pub(crate) 不可用，
# 服务层需从 DbPool::Sqlite 变体取出内部 Pool<Sqlite> 直查。
# 版本须与 tauri-plugin-sql 传递依赖（0.8.x）对齐，features 只开 sqlite 子集。
sqlx = { version = "0.8", default-features = false, features = [
    "sqlite",
    "runtime-tokio",
    "macros",
    "chrono",
] }
sysinfo = "0.32"
netstat2 = "0.9"
chrono = { version = "0.4", features = ["serde"] }
strum = { version = "0.26", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# windows crate features:
# - Win32_Foundation: HANDLE / CloseHandle
# - Win32_Security: CreateJobObjectW 的 SECURITY_ATTRIBUTES 参数（即便传 None 也需此 feature）
# - Win32_System_JobObjects: Job Object 全套 API
# - Win32_System_Threading: OpenProcess / IO_COUNTERS / PROCESS_ACCESS_RIGHTS
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[features]
# 默认使用自定义协议（production build）
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
